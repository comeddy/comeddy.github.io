  <title id="title">로봇이 연습할 작은 방을 위에서 보면</title>
  <desc id="description">공식 TurtleBot3 Burger를 사용하는 가상 경기장의 교육용 평면도. 안쪽 6x6 m, 벽 4개, 0.45x0.45x0.50 m 상자 8개. 그림의 배치는 설명용이며 실제 seed의 실행 결과가 아니다. 실제 시뮬레이터는 base_footprint 기준 높이 약 0.182 m에서 360개의 수평 PhysX ray로 같은 벽·상자의 충돌 형상을 측정한다. 이 그림의 광선은 일부만 표시하고 로봇 아이콘은 확대했다.</desc>
