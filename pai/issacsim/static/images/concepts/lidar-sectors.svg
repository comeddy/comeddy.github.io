  <text id="text-9" x="164.498" y="393.836" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">5</text>
  <path d="M 292 418 L 124.0000 418.0000 A 168 168 0 0 0 146.5077 502.0000 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-6" data-sector="6" data-start-deg="180" data-end-deg="210" />
  <text id="text-10" x="164.498" y="462.164" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">6</text>
  <path d="M 292 418 L 146.5077 502.0000 A 168 168 0 0 0 208.0000 563.4923 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-7" data-sector="7" data-start-deg="210" data-end-deg="240" />
  <text id="text-11" x="198.662" y="521.338" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">7</text>
  <path d="M 292 418 L 208.0000 563.4923 A 168 168 0 0 0 292.0000 586.0000 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-8" data-sector="8" data-start-deg="240" data-end-deg="270" />
  <text id="text-12" x="257.836" y="555.502" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">8</text>
  <path d="M 292 418 L 292.0000 586.0000 A 168 168 0 0 0 376.0000 563.4923 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-9" data-sector="9" data-start-deg="270" data-end-deg="300" />
  <text id="text-13" x="326.164" y="555.502" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">9</text>
  <path d="M 292 418 L 376.0000 563.4923 A 168 168 0 0 0 437.4923 502.0000 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-10" data-sector="10" data-start-deg="300" data-end-deg="330" />
  <text id="text-14" x="385.338" y="521.338" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">10</text>
  <path d="M 292 418 L 437.4923 502.0000 A 168 168 0 0 0 460.0000 418.0000 Z" fill="#e8f6f4" stroke="#086f73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-11" data-sector="11" data-start-deg="330" data-end-deg="360" />
  <text id="text-15" x="419.502" y="462.164" font-size="30" fill="#086f73" text-anchor="middle" font-weight="700">11</text>
  <path d="M 351 418 H 548" fill="none" stroke="#075bcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <text id="text-16" x="516" y="452" font-size="26" fill="#075bcb" text-anchor="middle" font-weight="700">+X</text>
  <text id="text-17" x="516" y="484" font-size="24" fill="#075bcb" text-anchor="middle" font-weight="500">0 rad</text>
  <path d="M 292 351 V 225" fill="none" stroke="#526b80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)" />
  <text id="text-18" x="292" y="212" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">+Y · 왼쪽</text>
  <text id="text-19" x="89" y="429" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">180°</text>
  <text id="text-20" x="292" y="624" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">270°</text>
  <path d="M 478.999 349.938 A 199 199 0 0 0 363.315 232.217" fill="none" stroke="#086f73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
  <text id="text-21" x="486" y="260" font-size="24" fill="#086f73" text-anchor="middle" font-weight="700">CCW</text>
  <circle cx="292" cy="418" r="52" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" />
  <g transform="translate(299.7 418) scale(1.1)">
    <rect x="-18" y="-33" width="32" height="12" rx="4" fill="#15283a" />
    <line x1="-10" y1="-31" x2="-10" y2="-23" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <line x1="0" y1="-31" x2="0" y2="-23" stroke="#ffffff" stroke-width="1" opacity="0.5" />
