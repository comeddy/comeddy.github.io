<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Noto Sans KR, AppleGothic, sans-serif" fill="#15283a">
  <title id="title">한 바퀴를 12칸으로, 한 칸은 가장 가까운 거리</title>
  <desc id="description">각도는 +X 전방에서 반시계 방향. 0번은 [0,30)도, 11번은 [330,360)도로 두 구역 모두 전방 정지 검사에 사용한다. 360도는 0도로 돌아온다. 유효한 한 구역 안에서는 최소 거리를 선택하며, 미터로 저장한다. 모델 입력만 clip(거리,0,3.5)/3.5로 정규화한다. 오른쪽 벽의 예시는 같은 구역의 1.5, 약 1.6, 약 1.7 m를 1.5 m로 요약한다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#075bcb" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#086f73" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#a3480c" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526b80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff" stroke="none" />
  <text id="text-1" x="44" y="44" font-size="24" fill="#075bcb" text-anchor="start" font-weight="700">거리 센서 읽기</text>
  <text id="text-2" x="44" y="100" font-size="42" fill="#15283a" text-anchor="start" font-weight="700">한 바퀴를 12칸으로, 한 칸은 가장 가까운 거리</text>
  <text id="text-3" x="44" y="140" font-size="26" fill="#526b80" text-anchor="start" font-weight="500">전방은 +X · 0 rad, 각도는 위에서 볼 때 반시계(CCW)로 증가합니다</text>
  <rect x="44" y="178" width="532" height="510" rx="18" fill="#f1f7fe" stroke="#d7e4ef" />
  <path d="M 292 418 L 460.0000 418.0000 A 168 168 0 0 0 437.4923 334.0000 Z" fill="#e8f6f4" stroke="#086f73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-0" data-sector="0" data-start-deg="0" data-end-deg="30" />
  <text id="text-4" x="419.502" y="393.836" font-size="30" fill="#086f73" text-anchor="middle" font-weight="700">0</text>
  <path d="M 292 418 L 437.4923 334.0000 A 168 168 0 0 0 376.0000 272.5077 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-1" data-sector="1" data-start-deg="30" data-end-deg="60" />
  <text id="text-5" x="385.338" y="334.662" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">1</text>
  <path d="M 292 418 L 376.0000 272.5077 A 168 168 0 0 0 292.0000 250.0000 Z" fill="#ffffff" stroke="#d7e4ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="sector-2" data-sector="2" data-start-deg="60" data-end-deg="90" />
  <text id="text-6" x="326.164" y="300.498" font-size="30" fill="#526b80" text-anchor="middle" font-weight="700">2</text>
