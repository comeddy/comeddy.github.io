    <circle cx="-7" cy="0" r="5" fill="#086f73" />
    <path d="M 13 -7 L 22 0 L 13 7" fill="none" stroke="#075bcb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  </g>
  <text id="text-22" x="310" y="667" font-size="28" fill="#086f73" text-anchor="middle" font-weight="700">전방 = 11번과 0번</text>
  <rect x="600" y="178" width="556" height="161" rx="18" fill="#e8f6f4" stroke="#d7e4ef" />
  <text id="text-23" x="624" y="217" font-size="28" fill="#15283a" text-anchor="start" font-weight="700">전방은 두 구역의 경계</text>
  <text id="text-24" x="632" y="265" font-size="28" fill="#086f73" text-anchor="start" font-weight="700">0번  ·  [0°, 30°)</text>
  <text id="text-25" x="632" y="308" font-size="28" fill="#086f73" text-anchor="start" font-weight="700">11번 ·  [330°, 360°)</text>
  <text id="text-26" x="1118" y="272" font-size="24" fill="#526b80" text-anchor="end" font-weight="500">360°</text>
  <text id="text-27" x="1118" y="308" font-size="24" fill="#526b80" text-anchor="end" font-weight="500">= 0°</text>
  <rect x="600" y="355" width="556" height="211" rx="18" fill="#f1f7fe" stroke="#d7e4ef" />
  <text id="text-28" x="624" y="393" font-size="28" fill="#15283a" text-anchor="start" font-weight="700">구역 안의 거리 → 최솟값</text>
  <rect x="791" y="443" width="10" height="106" rx="3" fill="#a3480c" stroke="none" />
  <text id="text-29" x="796" y="428" font-size="24" fill="#a3480c" text-anchor="middle" font-weight="500">벽</text>
  <line x1="641" y1="536" x2="791" y2="456.2435852507782" stroke="#086f73" stroke-width="3" stroke-linecap="round" />
  <circle cx="791" cy="456.2435852507782" r="4" fill="#a3480c" stroke="none" />
  <text id="text-30" x="817" y="464.2435852507782" font-size="24" fill="#526b80" text-anchor="start" font-weight="500">1.7 m</text>
  <line x1="641" y1="536" x2="791" y2="481.40446486006965" stroke="#086f73" stroke-width="3" stroke-linecap="round" />
  <circle cx="791" cy="481.40446486006965" r="4" fill="#a3480c" stroke="none" />
  <text id="text-31" x="817" y="489.40446486006965" font-size="24" fill="#526b80" text-anchor="start" font-weight="500">1.6 m</text>
  <line x1="641" y1="536" x2="791" y2="536.0" stroke="#086f73" stroke-width="3" stroke-linecap="round" />
  <circle cx="791" cy="536.0" r="4" fill="#a3480c" stroke="none" />
  <text id="text-32" x="817" y="544.0" font-size="24" fill="#526b80" text-anchor="start" font-weight="500">1.5 m</text>
  <circle cx="641" cy="536" r="7" fill="#086f73" stroke="none" />
  <path d="M 902 504 H 945" fill="none" stroke="#075bcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <text id="text-33" x="1050" y="507" font-size="40" fill="#075bcb" text-anchor="middle" font-weight="700">1.5 m</text>
  <text id="text-34" x="1050" y="544" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">대표 거리</text>
  <rect x="600" y="584" width="556" height="104" rx="18" fill="#e8f6f4" stroke="#d7e4ef" />
  <text id="text-35" x="624" y="621" font-size="26" fill="#15283a" text-anchor="start" font-weight="700">정규화 = clip(거리, 0, 3.5) ÷ 3.5</text>
  <text id="text-36" x="624" y="661" font-size="24" fill="#086f73" text-anchor="start" font-weight="500">1.5 m → 약 0.43  ·  모델 입력은 0~1</text>
  <text id="text-37" x="44" y="730" font-size="24" fill="#526b80" text-anchor="start" font-weight="500">거리는 m로 저장합니다. 무효·누락 구역은 0으로 처리하고 정지합니다.</text>
</svg>