<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Noto Sans KR, AppleGothic, sans-serif" fill="#15283a">
  <title id="title">바닥에 놓기 전에, 세 번의 문을 통과해요</title>
  <desc id="description">시작 전 명령 만료 패치 설치, 재빌드, bringup 재시작, 모터 명령 publisher 0 확인, 물리 전원 차단 준비가 필요하다. 1: --arm 없이 preview만 발행하고 /cmd_vel에는 발행하지 않는다. 2: 바퀴를 띄워 --arm --max-linear 0.05로 실행, 0.35 m 이내 전방 장애물에서 정지 고정 확인. 3: 바퀴를 계속 띄우고 bringup을 유지한 채 정책을 SIGKILL하여 실제 바퀴 정지가 1.5 s 이내인지 측정한다. bringup 종료와 통신 단절도 각각 별도로 시험한다. 4: 모두 통과한 뒤 정책을 종료하고 바닥에 내려놓아 최대 0.05 m/s로 30초 주행한다. 1.5 s는 교육용 실측 통과 기준이며 보장값이 아니다. Python 스캔 만료는 0.5 s, 검사 주기는 0.05 s. bringup 명령 만료 0.5 s와 OpenCR heartbeat timeout은 연속 작동. OpenCR PUSH SW1/SW2는 주행 테스트 버튼이며 물리 비상 정지 버튼이 아니다.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#075bcb" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#086f73" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#a3480c" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#526b80" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="0" fill="#ffffff" stroke="none" />
  <text id="text-1" x="44" y="44" font-size="24" fill="#075bcb" text-anchor="start" font-weight="700">실물 배포의 순서</text>
  <text id="text-2" x="44" y="100" font-size="42" fill="#15283a" text-anchor="start" font-weight="700">바닥에 놓기 전에, 세 번의 문을 통과해요</text>
  <text id="text-3" x="44" y="140" font-size="26" fill="#526b80" text-anchor="start" font-weight="500">앞 단계가 통과해야 다음 단계로 · 실패하면 진행을 중단합니다</text>
  <rect x="44" y="170" width="1112" height="80" rx="18" fill="#fff2e6" stroke="#d7e4ef" />
  <text id="text-4" x="66" y="203" font-size="26" fill="#a3480c" text-anchor="start" font-weight="700">시작 조건 · 명령 만료 패치 설치 → 재빌드 → bringup 재시작</text>
  <text id="text-5" x="66" y="237" font-size="24" fill="#15283a" text-anchor="start" font-weight="500">정책 시작 전 /cmd_vel 발행자 0 · 물리 전원 차단 준비</text>
  <text id="text-6" x="596" y="279" font-size="24" fill="#086f73" text-anchor="middle" font-weight="500">2~3단계는 바퀴를 계속 띄워 둡니다</text>
  <rect x="44" y="289" width="244" height="327" rx="18" fill="#f1f7fe" stroke="#d7e4ef" />
  <circle cx="73" cy="311" r="18" fill="#075bcb" stroke="none" />
  <text id="text-7" x="73" y="320" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text id="text-8" x="166.0" y="356" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">그림자 실행</text>
  <path d="M 294 416 H 319" fill="none" stroke="#086f73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
  <rect x="326" y="289" width="244" height="327" rx="18" fill="#f1f7fe" stroke="#d7e4ef" />
  <circle cx="355" cy="311" r="18" fill="#075bcb" stroke="none" />
  <text id="text-9" x="355" y="320" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text id="text-10" x="448.0" y="356" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">바퀴를 띄워 실행</text>
  <path d="M 576 416 H 601" fill="none" stroke="#086f73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
  <rect x="608" y="289" width="258" height="327" rx="18" fill="#f1f7fe" stroke="#d7e4ef" />
  <circle cx="637" cy="311" r="18" fill="#075bcb" stroke="none" />
  <text id="text-11" x="637" y="320" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text id="text-12" x="737.0" y="356" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">독립 정지 시험</text>
  <path d="M 872 416 H 897" fill="none" stroke="#086f73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)" />
  <rect x="904" y="289" width="252" height="327" rx="18" fill="#e8f6f4" stroke="#d7e4ef" />
  <circle cx="933" cy="311" r="18" fill="#086f73" stroke="none" />
  <text id="text-13" x="933" y="320" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <text id="text-14" x="1030.0" y="356" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">바닥에서 30초</text>
  <rect x="135.2" y="391.6" width="61.599999999999994" height="39.199999999999996" rx="4.199999999999999" fill="#ffffff" stroke="#075bcb" stroke-width="3" />
  <path d="M 127.5 437.1 H 204.5 L 196.8 430.8 H 135.2 Z" fill="#f1f7fe" stroke="#075bcb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="146.4" y1="404.2" x2="177.2" y2="404.2" stroke="#086f73" stroke-width="4" stroke-linecap="round" />
  <line x1="146.4" y1="414.0" x2="185.6" y2="414.0" stroke="#086f73" stroke-width="4" stroke-linecap="round" />
  <line x1="146.4" y1="423.8" x2="168.8" y2="423.8" stroke="#086f73" stroke-width="4" stroke-linecap="round" />
  <text id="text-15" x="166" y="485" font-size="26" fill="#075bcb" text-anchor="middle" font-weight="700">--arm 없음</text>
  <text id="text-16" x="166" y="529" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">/cmd_vel 발행 없음</text>
  <text id="text-17" x="166" y="570" font-size="25" fill="#526b80" text-anchor="middle" font-weight="500">preview만 확인</text>
  <g transform="translate(448 403) scale(0.83)">
    <rect x="-37" y="1" width="14" height="33" rx="5" fill="#15283a" />
    <rect x="23" y="1" width="14" height="33" rx="5" fill="#15283a" />
    <rect x="-29" y="-18" width="58" height="9" rx="4" fill="#ffffff" stroke="#075bcb" stroke-width="2.5" />
    <rect x="-29" y="0" width="58" height="9" rx="4" fill="#ffffff" stroke="#075bcb" stroke-width="2.5" />
    <line x1="-21" y1="-14" x2="-21" y2="3" stroke="#075bcb" stroke-width="3" />
    <line x1="21" y1="-14" x2="21" y2="3" stroke="#075bcb" stroke-width="3" />
    <rect x="-12" y="-35" width="24" height="16" rx="5" fill="#086f73" />
    <ellipse cx="0" cy="-35" rx="12" ry="4" fill="#e8f6f4" stroke="#086f73" stroke-width="2" />
    <path d="M -16 10 L -21 47 L 21 47 L 16 10" fill="#fff2e6" stroke="#a3480c" stroke-width="2.5" />
    <path d="M -48 55 H 48" stroke="#d7e4ef" stroke-width="3" />
  </g>
  <text id="text-18" x="448" y="484" font-size="25" fill="#075bcb" text-anchor="middle" font-weight="700">--arm · ≤0.05 m/s</text>
  <text id="text-19" x="448" y="529" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">전방 ≤0.35 m 정지</text>
  <text id="text-20" x="448" y="568" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">상자를 치워도</text>
  <text id="text-21" x="448" y="601" font-size="24" fill="#a3480c" text-anchor="middle" font-weight="700">자동 재개 없음</text>
  <circle cx="737" cy="411" r="32" fill="#ffffff" stroke="#a3480c" stroke-width="3" />
  <rect x="728" y="368" width="18" height="9" rx="3" fill="#a3480c" stroke="none" />
  <line x1="737" y1="411" x2="737" y2="392" stroke="#a3480c" stroke-width="4" stroke-linecap="round" />
  <line x1="737" y1="411" x2="753" y2="418" stroke="#a3480c" stroke-width="4" stroke-linecap="round" />
  <text id="text-22" x="737" y="471" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">bringup 유지 상태에서</text>
  <text id="text-23" x="737" y="504" font-size="25" fill="#15283a" text-anchor="middle" font-weight="700">정책 강제 종료</text>
  <text id="text-24" x="737" y="543" font-size="29" fill="#a3480c" text-anchor="middle" font-weight="700">실측 정지 ≤1.5 s</text>
  <text id="text-25" x="737" y="578" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">bringup 종료·통신 단절</text>
  <text id="text-26" x="737" y="607" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">각각 정지 확인</text>
  <g transform="translate(1030 412) scale(0.85)">
    <rect x="-37" y="1" width="14" height="33" rx="5" fill="#15283a" />
    <rect x="23" y="1" width="14" height="33" rx="5" fill="#15283a" />
    <rect x="-29" y="-18" width="58" height="9" rx="4" fill="#ffffff" stroke="#075bcb" stroke-width="2.5" />
    <rect x="-29" y="0" width="58" height="9" rx="4" fill="#ffffff" stroke="#075bcb" stroke-width="2.5" />
    <line x1="-21" y1="-14" x2="-21" y2="3" stroke="#075bcb" stroke-width="3" />
    <line x1="21" y1="-14" x2="21" y2="3" stroke="#075bcb" stroke-width="3" />
    <rect x="-12" y="-35" width="24" height="16" rx="5" fill="#086f73" />
    <ellipse cx="0" cy="-35" rx="12" ry="4" fill="#e8f6f4" stroke="#086f73" stroke-width="2" />
    <path d="M -48 36 H 48" stroke="#d7e4ef" stroke-width="3" />
  </g>
  <rect x="923" y="464" width="214" height="38" rx="10" fill="#ffffff" stroke="none" />
  <text id="text-27" x="1030" y="491" font-size="24" fill="#086f73" text-anchor="middle" font-weight="700">모든 정지 시험 통과</text>
  <text id="text-28" x="1030" y="537" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">정책을 끈 뒤</text>
  <text id="text-29" x="1030" y="570" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">바닥에 내려놓기</text>
  <text id="text-30" x="1030" y="604" font-size="25" fill="#086f73" text-anchor="middle" font-weight="700">≤0.05 m/s 유지</text>
  <rect x="44" y="636" width="1112" height="72" rx="18" fill="#fff2e6" stroke="#d7e4ef" />
  <text id="text-31" x="66" y="667" font-size="28" fill="#a3480c" text-anchor="start" font-weight="700">미통과 → 바닥 주행 금지</text>
  <text id="text-32" x="66" y="697" font-size="24" fill="#15283a" text-anchor="start" font-weight="500">1.5초는 실측 통과 기준이며, 코드나 펌웨어의 보장 시간이 아닙니다.</text>
  <text id="text-33" x="44" y="745" font-size="24" fill="#526b80" text-anchor="start" font-weight="500">센서 만료 0.5 s · 검사 0.05 s / bringup 명령 만료 0.5 s → OpenCR 통신 timeout</text>
</svg>