  <text id="text-4" x="136.0" y="240" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">2D 라이다</text>
  <text id="text-5" x="136.0" y="398" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">주변 거리 측정</text>
  <text id="text-6" x="136.0" y="434" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">360° 스캔</text>
