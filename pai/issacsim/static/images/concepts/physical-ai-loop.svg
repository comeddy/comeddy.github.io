  <text id="text-7" x="360.0" y="240" font-size="27" fill="#15283a" text-anchor="middle" font-weight="700">12개 거리</text>
  <text id="text-8" x="360.0" y="398" font-size="24" fill="#15283a" text-anchor="middle" font-weight="500">구역별 최솟값</text>
  <text id="text-9" x="360.0" y="434" font-size="24" fill="#526b80" text-anchor="middle" font-weight="500">거리 단위 m</text>
