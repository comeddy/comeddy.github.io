  <text id="text-21" x="615" y="586" font-size="28" fill="#086f73" text-anchor="start" font-weight="700">Raspberry Pi · 로컬 추론</text>
  <text id="text-22" x="615" y="623" font-size="25" fill="#15283a" text-anchor="start" font-weight="500">SHA-256 확인 후 모델 읽기</text>
  <text id="text-23" x="816" y="666" font-size="26" fill="#086f73" text-anchor="middle" font-weight="700">센서 → 정책 → 정지 검사 → 모터</text>
  <text id="text-24" x="600" y="725" font-size="27" fill="#075bcb" text-anchor="middle" font-weight="500">AWS에서 실시간 모터 명령을 보내지 않습니다.</text>
</svg>