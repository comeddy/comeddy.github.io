    <line x1="0" y1="23" x2="0" y2="31" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <line x1="10" y1="23" x2="10" y2="31" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    <rect x="-29" y="-22" width="58" height="44" rx="14" fill="#ffffff" stroke="#075bcb" stroke-width="3" />
    <circle cx="-7" cy="0" r="14" fill="#e8f6f4" stroke="#086f73" stroke-width="3" />
    <circle cx="-7" cy="0" r="5" fill="#086f73" />
    <path d="M 13 -7 L 22 0 L 13 7" fill="none" stroke="#075bcb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
