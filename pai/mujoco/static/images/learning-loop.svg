<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">강화학습: 행동하고, 결과에서 배웁니다</title><desc id="desc">한 스텝의 경험을 모아 PPO가 정책을 업데이트합니다. 이 과정은 클라우드 시뮬레이션 안에서 반복됩니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#143F43"/></marker></defs>
<rect width="1440" height="940" fill="#F5F6F0"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Noto Sans CJK KR, sans-serif">
<text x="64" y="61" font-size="16" font-weight="700" fill="#143F43" text-anchor="start">PHYSICAL AI   /   01  LEARN BY TRYING</text>
<text x="64" y="130" font-size="44" font-weight="750" fill="#143F43" text-anchor="start">강화학습: 행동하고, 결과에서 배웁니다</text>
<text x="64" y="180" font-size="22" font-weight="400" fill="#536B6C" text-anchor="start">한 스텝의 경험을 모아 PPO가 정책을 업데이트합니다. 이 과정은 클라우드 시뮬레이션 안에서 반복됩니다.</text>
<rect x="64" y="310" width="290" height="268" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="103" cy="352" r="23" fill="#F0D160"/><text x="103" y="359" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">1</text><text x="89" y="418" font-size="29" font-weight="700" fill="#143F43" text-anchor="start">관측 o(t)</text><text x="89" y="465" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">현재 상태를 숫자로</text><text x="89" y="497" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">관절각 · 관절 속도</text><text x="89" y="529" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">몸의 방향 · 목표 속도</text><path d="M364 445 H401" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="414" y="310" width="290" height="268" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="453" cy="352" r="23" fill="#F0D160"/><text x="453" y="359" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">2</text><text x="439" y="418" font-size="29" font-weight="700" fill="#143F43" text-anchor="start">정책 πθ</text><text x="439" y="465" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">신경망이 관측을 읽고</text><text x="439" y="497" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">다음 행동을 제안</text><text x="439" y="529" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">지금의 파라미터 θ 사용</text><path d="M714 445 H751" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="764" y="310" width="290" height="268" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="803" cy="352" r="23" fill="#F0D160"/><text x="803" y="359" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">3</text><text x="789" y="418" font-size="29" font-weight="700" fill="#143F43" text-anchor="start">행동 a(t)</text><text x="789" y="465" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">예: 관절 목표값</text><text x="789" y="497" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">제어기 입력의 의미는</text><text x="789" y="529" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">환경 설정으로 확인</text><path d="M1064 445 H1101" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1114" y="310" width="262" height="268" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="1153" cy="352" r="23" fill="#F0D160"/><text x="1153" y="359" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">4</text><text x="1139" y="418" font-size="29" font-weight="700" fill="#143F43" text-anchor="start">시뮬레이터</text><text x="1139" y="465" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">MuJoCo Warp</text><text x="1139" y="497" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">가상 로봇이 한 스텝</text><text x="1139" y="529" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">새 관측 · 보상 · 종료</text><path d="M1244 302 V247 H204 V301" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="521" y="227" width="392" height="42" rx="10" fill="#F5F6F0" stroke="#F5F6F0"/><text x="717" y="256" font-size="19" font-weight="600" fill="#143F43" text-anchor="middle">다음 관측 o(t+1)로 반복</text><rect x="760" y="648" width="616" height="136" rx="20" fill="#E9F1ED" stroke="#D6E1DB"/><text x="791" y="692" font-size="27" font-weight="700" fill="#143F43" text-anchor="start">경험 모으기 · Rollout</text><text x="791" y="730" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">관측·행동·보상·종료 여부를 기록</text><text x="791" y="761" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">여러 병렬 환경에서 일정 길이만큼 수집</text><rect x="64" y="648" width="616" height="136" rx="20" fill="#FFF6D2" stroke="#E2CB70"/><text x="94" y="692" font-size="27" font-weight="700" fill="#143F43" text-anchor="start">PPO 업데이트</text><text x="94" y="730" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">수집한 경험으로 정책 θ를 조정</text><text x="94" y="761" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">보상은 학습 신호이며 안전 보증이 아닙니다</text><path d="M1244 589 V636" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M748 716 H692" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M209 636 V610 H559 V590" fill="none" stroke="#143F43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="290" y="638" font-size="17" font-weight="400" fill="#536B6C" text-anchor="start">갱신한 정책으로 다시 수집</text><path d="M64 852 H1376" fill="none" stroke="#D6E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="893" font-size="17" font-weight="400" fill="#536B6C" text-anchor="start">교육용 개념도 · 관측·행동·보상 정의와 PPO 설정은 선택한 환경의 실제 코드를 기준으로 확인합니다.</text></g></svg>