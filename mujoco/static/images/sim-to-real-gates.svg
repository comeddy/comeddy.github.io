<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">Sim → Real: 단계마다 통과 조건이 있습니다</title><desc id="desc">시뮬레이션에서 좋은 결과를 얻어도 바로 모터를 움직이지 않습니다. 검증 결과를 확인하며 다음 단계로 진행합니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#143F43"/></marker></defs>
<rect width="1440" height="940" fill="#F5F6F0"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Noto Sans CJK KR, sans-serif">
<text x="64" y="61" font-size="16" font-weight="700" fill="#143F43" text-anchor="start">PHYSICAL AI   /   02  CHECK BEFORE TRANSFER</text>
<text x="64" y="130" font-size="44" font-weight="750" fill="#143F43" text-anchor="start">Sim → Real: 단계마다 통과 조건이 있습니다</text>
<text x="64" y="180" font-size="22" font-weight="400" fill="#536B6C" text-anchor="start">시뮬레이션에서 좋은 결과를 얻어도 바로 모터를 움직이지 않습니다. 검증 결과를 확인하며 다음 단계로 진행합니다.</text>
<rect x="64" y="293" width="304" height="374" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="105" cy="338" r="23" fill="#F0D160"/><text x="105" y="345" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">01</text><text x="89" y="408" font-size="28" font-weight="700" fill="#143F43" text-anchor="start">번들 무결성</text><circle cx="94" cy="457" r="3.5" fill="#143F43"/><text x="111" y="464" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">파일 목록과 버전</text><circle cx="94" cy="498" r="3.5" fill="#143F43"/><text x="111" y="505" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">manifest · ONNX</text><circle cx="94" cy="539" r="3.5" fill="#143F43"/><text x="111" y="546" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">checkpoint 출처</text><circle cx="94" cy="580" r="3.5" fill="#143F43"/><text x="111" y="587" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">SHA-256 일치</text><rect x="88" y="620" width="256" height="29" rx="8" fill="#E9F1ED" stroke="#E9F1ED"/><text x="216" y="640" font-size="15" font-weight="600" fill="#143F43" text-anchor="middle">통과 후 다음 단계</text><path d="M375 486 H393" fill="none" stroke="#143F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="400" y="293" width="304" height="374" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="441" cy="338" r="23" fill="#F0D160"/><text x="441" y="345" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">02</text><text x="425" y="408" font-size="28" font-weight="700" fill="#143F43" text-anchor="start">입출력 계약</text><circle cx="430" cy="457" r="3.5" fill="#143F43"/><text x="447" y="464" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">관절 이름과 순서</text><circle cx="430" cy="498" r="3.5" fill="#143F43"/><text x="447" y="505" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">각도·속도 단위</text><circle cx="430" cy="539" r="3.5" fill="#143F43"/><text x="447" y="546" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">정규화·스케일</text><circle cx="430" cy="580" r="3.5" fill="#143F43"/><text x="447" y="587" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">제어 주기와 제한</text><rect x="424" y="620" width="256" height="29" rx="8" fill="#E9F1ED" stroke="#E9F1ED"/><text x="552" y="640" font-size="15" font-weight="600" fill="#143F43" text-anchor="middle">통과 후 다음 단계</text><path d="M711 486 H729" fill="none" stroke="#143F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="736" y="293" width="304" height="374" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="777" cy="338" r="23" fill="#F0D160"/><text x="777" y="345" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">03</text><text x="761" y="408" font-size="28" font-weight="700" fill="#143F43" text-anchor="start">시뮬레이션 검증</text><circle cx="766" cy="457" r="3.5" fill="#143F43"/><text x="783" y="464" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">내보낸 정책 평가</text><circle cx="766" cy="498" r="3.5" fill="#143F43"/><text x="783" y="505" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">관측·행동 값 점검</text><circle cx="766" cy="539" r="3.5" fill="#143F43"/><text x="783" y="546" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">목표와 실패 조건</text><circle cx="766" cy="580" r="3.5" fill="#143F43"/><text x="783" y="587" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">실제 실행 설정 비교</text><rect x="760" y="620" width="256" height="29" rx="8" fill="#E9F1ED" stroke="#E9F1ED"/><text x="888" y="640" font-size="15" font-weight="600" fill="#143F43" text-anchor="middle">통과 후 다음 단계</text><path d="M1047 486 H1065" fill="none" stroke="#143F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1072" y="293" width="304" height="374" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><circle cx="1113" cy="338" r="23" fill="#F0D160"/><text x="1113" y="345" font-size="20" font-weight="700" fill="#143F43" text-anchor="middle">04</text><text x="1097" y="408" font-size="28" font-weight="700" fill="#143F43" text-anchor="start">실기 실행 승인</text><circle cx="1102" cy="457" r="3.5" fill="#143F43"/><text x="1119" y="464" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">운영자 점검·승인</text><circle cx="1102" cy="498" r="3.5" fill="#143F43"/><text x="1119" y="505" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">지지 상태에서 시작</text><circle cx="1102" cy="539" r="3.5" fill="#143F43"/><text x="1119" y="546" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">비상정지 준비·확인</text><circle cx="1102" cy="580" r="3.5" fill="#143F43"/><text x="1119" y="587" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">로컬 50Hz 제어</text><rect x="1096" y="620" width="256" height="29" rx="8" fill="#E9F1ED" stroke="#E9F1ED"/><text x="1224" y="640" font-size="15" font-weight="600" fill="#143F43" text-anchor="middle">통과 후 다음 단계</text><rect x="64" y="712" width="1312" height="102" rx="20" fill="#143F43" stroke="#143F43"/><text x="95" y="755" font-size="27" font-weight="700" fill="#F0D160" text-anchor="start">하나라도 실패하면 STOP</text><text x="95" y="789" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="start">원인을 수정하고 해당 단계부터 다시 검증합니다. 클라우드는 실시간 모터 루프에 참여하지 않습니다.</text><path d="M64 852 H1376" fill="none" stroke="#D6E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="893" font-size="17" font-weight="400" fill="#536B6C" text-anchor="start">개념적 점검 흐름 · SHA-256 일치는 파일 무결성 확인이며 모델의 안전성·성능 인증이 아닙니다.</text></g></svg>