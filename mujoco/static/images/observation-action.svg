<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">관절각은 관측의 한 부분입니다</title><desc id="desc">각도 q는 “어디에 있는가”, 각속도 q̇는 “얼마나 빠르게 움직이는가”를 나타냅니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#143F43"/></marker></defs>
<rect width="1440" height="940" fill="#F5F6F0"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Noto Sans CJK KR, sans-serif">
<text x="64" y="61" font-size="16" font-weight="700" fill="#143F43" text-anchor="start">PHYSICAL AI   /   03  READ THE ROBOT</text>
<text x="64" y="130" font-size="44" font-weight="750" fill="#143F43" text-anchor="start">관절각은 관측의 한 부분입니다</text>
<text x="64" y="180" font-size="22" font-weight="400" fill="#536B6C" text-anchor="start">각도 q는 “어디에 있는가”, 각속도 q̇는 “얼마나 빠르게 움직이는가”를 나타냅니다.</text>
<rect x="64" y="250" width="556" height="554" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><text x="94" y="297" font-size="25" font-weight="700" fill="#143F43" text-anchor="start">한쪽 다리의 단순 기하 모형</text><path d="M127 733 H557" fill="none" stroke="#A6BBB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M268 356 V710" fill="none" stroke="#A6BBB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/><rect x="224" y="339" width="106" height="74" rx="10" fill="#143F43" stroke="#143F43"/><path d="M277 420 L358 548 L281 700" fill="none" stroke="#74998E" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M277 420 L358 548" fill="none" stroke="#CADBD1" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/><rect x="247" y="686" width="142" height="34" rx="7" fill="#143F43" stroke="#143F43"/><circle cx="277" cy="420" r="17" fill="#F0D160" stroke="#143F43" stroke-width="3"/><circle cx="358" cy="548" r="17" fill="#F0D160" stroke="#143F43" stroke-width="3"/><circle cx="281" cy="700" r="17" fill="#F0D160" stroke="#143F43" stroke-width="3"/><path d="M277 468 A48 48 0 0 0 303 459" fill="none" stroke="#143F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M333 514 A42 42 0 0 0 339 586" fill="none" stroke="#143F43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 420 H416" fill="none" stroke="#68817A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="426" font-size="21" font-weight="600" fill="#143F43" text-anchor="start">q₁ 고관절</text><path d="M379 548 H416" fill="none" stroke="#68817A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="555" font-size="21" font-weight="600" fill="#143F43" text-anchor="start">q₂ 무릎</text><path d="M301 680 H416" fill="none" stroke="#68817A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="687" font-size="21" font-weight="600" fill="#143F43" text-anchor="start">q₃ 발목</text><text x="94" y="775" font-size="18" font-weight="400" fill="#536B6C" text-anchor="start">치수·축·가동 범위는 실제 로봇 사양이 아닙니다.</text><rect x="660" y="250" width="716" height="168" rx="20" fill="#FFF6D2" stroke="#E2CB70"/><text x="694" y="294" font-size="27" font-weight="700" fill="#143F43" text-anchor="start">q / q̇ 를 함께 읽기</text><text x="694" y="336" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">같은 각도에서도 멈춘 상태와 움직이는 상태는 다릅니다.</text><text x="694" y="370" font-size="21" font-weight="400" fill="#143F43" text-anchor="start">q̇는 시간에 따른 q의 변화입니다. 실제 단위·부호를 확인하세요.</text><rect x="660" y="450" width="716" height="214" rx="20" fill="#FFFFFF" stroke="#D6E1DB"/><text x="694" y="494" font-size="27" font-weight="700" fill="#143F43" text-anchor="start">관측 벡터 o(t)에 담을 수 있는 값</text><text x="694" y="538" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">[ 관절각 q, 관절 속도 q̇, 몸의 방향, 목표 속도, … ]</text><text x="694" y="577" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">환경에 따라 IMU·이전 행동·접촉 정보 등이 추가됩니다.</text><text x="694" y="616" font-size="20" font-weight="400" fill="#143F43" text-anchor="start">정확한 길이·순서·정규화는 manifest와 환경 설정을 대조합니다.</text><rect x="660" y="696" width="716" height="108" rx="20" fill="#143F43" stroke="#143F43"/><text x="694" y="739" font-size="25" font-weight="700" fill="#F0D160" text-anchor="start">관측 o(t) → 정책 → 행동 a(t)</text><text x="694" y="777" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="start">행동은 예: 관절 목표값. 슬라이더는 기하 자세만 바꿉니다.</text><path d="M64 852 H1376" fill="none" stroke="#D6E1DB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="893" font-size="17" font-weight="400" fill="#536B6C" text-anchor="start">독자 제작 교육용 도식 · 실제 Microduck의 형상·질량·관절축·관측 텐서·동역학을 재현하거나 검증하지 않았습니다.</text></g></svg>